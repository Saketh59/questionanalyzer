<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Analyzer — Compare Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body class="min-h-screen relative bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white overflow-x-hidden">
    <!-- Animated Background Glows -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="bg-glow top-16 right-24 w-72 h-72"></div>
      <div class="bg-glow bg-glow-purple bottom-10 left-24 w-[32rem] h-[32rem] opacity-70"></div>
      <div class="bg-glow bg-glow-cyan top-1/3 left-1/2 w-40 h-40"></div>
    </div>

    <!-- Navbar -->
    <header class="relative z-10 sticky top-0 backdrop-blur bg-black/30 border-b border-white/10">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="QA Analyzer" class="w-8 h-8 rotate-on-hover" />
          <h1 class="text-xl font-semibold">QA Analyzer</h1>
        </div>
        <nav class="flex items-center gap-2 text-sm">
          <a href="/home" class="px-3 py-2 rounded bg-gray-800 hover:bg-gray-700 transition">Home</a>
          <a href="/dashboard/analyze" class="px-3 py-2 rounded bg-gray-800 hover:bg-gray-700 transition">Analyze</a>
          <a href="/dashboard/generate" class="px-3 py-2 rounded bg-gray-800 hover:bg-gray-700 transition">Generate</a>
          <a href="/dashboard/compare" class="px-3 py-2 rounded bg-indigo-600 hover:bg-indigo-500 transition">Compare</a>
          <a href="/logout" class="px-3 py-2 rounded bg-gray-800 hover:bg-gray-700 transition">Logout</a>
        </nav>
      </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto px-6 py-8">
      <section class="glass-card rounded-2xl p-6">
        <h2 class="text-2xl font-bold mb-2">Compare Papers</h2>
        <p class="text-white/70 mb-6">Upload two or more PDFs to compare difficulty, topic coverage, and overlap of questions.</p>

        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-white/80 mb-1">Subject (optional)</label>
              <select id="cmp-subject" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Auto</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="ComputerScience">Computer Science</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-white/80 mb-1">Upload Question Papers (PDF)</label>
              <input id="cmp-files" type="file" accept="application/pdf" multiple class="block w-full text-sm text-white/80 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
            </div>
          </div>
          <div>
            
          </div>
          <div class="flex items-center gap-3">
            <button id="cmpAnalyzeBtn" class="px-6 py-3 rounded-lg gradient-button">Analyze & Compare</button>
            <button id="cmpClearBtn" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition">Clear</button>
          </div>
        </div>

        <div id="cmpResults" class="mt-8 hidden">
          <h3 class="text-xl font-semibold mb-3">Results</h3>

          <!-- Overall verdict -->
          <div id="cmpVerdict" class="rounded-xl p-4 bg-gray-800/60 border border-white/10 text-white/90"></div>
          <div id="cmpRec" class="mt-2 text-white/70 text-sm"></div>

          

          <!-- Difficulty per paper (compact) -->
          <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-6" id="cmpDiffGrid"></div>

          <!-- Topic coverage charts per paper -->
          <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-6" id="cmpTopicGrid"></div>

          <!-- Per-paper Important Topics -->
          <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-6" id="cmpPaperTopTopics"></div>

          <!-- Overlap summary -->
          <div class="mt-6 rounded-xl p-4 bg-gray-900/40 border border-white/10">
            <h4 class="text-lg font-semibold mb-2">Overlap / Similarity</h4>
            <div id="cmpOverlap" class="text-white/80 text-sm"></div>
          </div>

          <!-- Most Repeated Questions -->
          <div class="mt-6 rounded-2xl p-5 bg-gray-900/40 border border-white/10">
            <h4 class="text-lg font-semibold mb-3">Most Repeated Questions</h4>
            <ol id="cmpRepeated" class="list-decimal list-inside space-y-2"></ol>
          </div>

          
        </div>
      </section>
    </main>

    <script>
      // Minimal page-specific script to call backend and draw charts using global Chart
      async function postCompare(files, subject) {
        const fd = new FormData();
        for (let i = 0; i < files.length; i++) fd.append('files', files[i]);
        if (subject) fd.append('subject', subject);
        const resp = await fetch('/api/compare_papers', { method: 'POST', body: fd });
        if (!resp.ok) { throw new Error(await resp.text()); }
        return resp.json();
      }
      function chart(id, labels, data, title, height=120) {
        const c = document.createElement('canvas');
        c.height = height;
        const wrap = document.createElement('div');
        wrap.className = 'bg-gray-900/40 rounded-xl p-4 border border-white/10';
        const head = document.createElement('div');
        head.className = 'text-sm text-white/70 mb-2';
        head.textContent = title;
        wrap.appendChild(head);
        wrap.appendChild(c);
        new Chart(c, { type: 'bar', data: { labels, datasets: [{ label: 'Count', data, backgroundColor: ['#22c55e','#f59e0b','#ef4444'] }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero:true, ticks: { precision:0 } } } } });
        return wrap;
      }
      document.addEventListener('DOMContentLoaded', () => {
        const files = document.getElementById('cmp-files');
        const subjectSel = document.getElementById('cmp-subject');
        const btn = document.getElementById('cmpAnalyzeBtn');
        const clearBtn = document.getElementById('cmpClearBtn');
        const results = document.getElementById('cmpResults');
        const verdict = document.getElementById('cmpVerdict');
        const rec = document.getElementById('cmpRec');
        const diffGrid = document.getElementById('cmpDiffGrid');
        const topicGrid = document.getElementById('cmpTopicGrid');
        const paperTopTopics = document.getElementById('cmpPaperTopTopics');
        const overlapBox = document.getElementById('cmpOverlap');
        const repeatedList = document.getElementById('cmpRepeated');

        btn?.addEventListener('click', async () => {
          if (!files?.files?.length || files.files.length < 2) { alert('Please choose at least two PDF files.'); return; }
          try {
            btn.disabled = true;
            diffGrid.innerHTML = topicGrid.innerHTML = overlapBox.innerHTML = verdict.innerHTML = '';
            rec.innerHTML = '';
            paperTopTopics.innerHTML = '';
            repeatedList.innerHTML = '';
            const data = await postCompare(files.files, subjectSel?.value || '');
            // Difficulty per paper (compact bars) and grouped comparison
            const papers = (data.papers || []);
            papers.forEach((p, i) => {
              const labels = ['Easy','Medium','Hard'];
              const vals = [p.difficulty?.Easy||0, p.difficulty?.Medium||0, p.difficulty?.Hard||0];
              diffGrid.appendChild(chart('pd'+i, labels, vals, `Difficulty — ${p.name}`, 120));
            });
            
            // Topics
            (data.papers || []).forEach((p, idx) => {
              const labels = Object.keys(p.topics || {});
              const vals = labels.map(k => p.topics[k]);
              topicGrid.appendChild(chart('t'+idx, labels, vals, `Topics — ${p.name}`));
              // Also render top topics list for each paper
              const card = document.createElement('div');
              card.className = 'rounded-2xl p-5 bg-gray-900/40 border border-white/10';
              const h = document.createElement('div');
              h.className = 'text-sm text-white/70 mb-2';
              h.textContent = `Important Topics — ${p.name}`;
              const ul = document.createElement('ul');
              ul.className = 'space-y-1';
              (p.top_topics || []).forEach(t => {
                const li = document.createElement('li');
                li.innerHTML = `<span class=\"inline-block w-2 h-2 rounded-full bg-cyan-400 mr-2\"></span>${t.topic} <span class=\"text-white/60 text-sm\">(${t.count})</span>`;
                ul.appendChild(li);
              });
              card.appendChild(h); card.appendChild(ul);
              paperTopTopics.appendChild(card);
            });
            // Verdict
            verdict.textContent = data.verdict || '';
            if (data.recommendation_text) rec.textContent = data.recommendation_text;
            // Overlap
            overlapBox.innerHTML = `Identical: <b>${data.overlap?.identical||0}</b><br/>Similar: <b>${data.overlap?.similar||0}</b>`;

            // Repeated questions list
            (data.repeated_questions || []).forEach((rq, i) => {
              const li = document.createElement('li');
              li.className = 'text-white/90';
              const pills = (rq.papers||[]).map(p => `<span class=\"inline-block text-xs px-2 py-0.5 rounded-full bg-white/10 border border-white/10 mr-1\">${p}</span>`).join('');
              li.innerHTML = `<span class=\"font-medium\">${rq.text}</span> <span class=\"ml-2 text-xs text-white/60\">×${rq.count}</span><div class=\"mt-1\">${pills}</div>`;
              repeatedList.appendChild(li);
            });

            
            results.classList.remove('hidden');
          } catch (e) {
            console.error(e);
            alert('Compare failed. '+(e?.message||''));
          } finally {
            btn.disabled = false;
          }
        });
        clearBtn?.addEventListener('click', () => {
          files.value='';
          diffGrid.innerHTML = topicGrid.innerHTML = overlapBox.innerHTML = verdict.innerHTML = '';
          results.classList.add('hidden');
        });
      });
    </script>
  </body>
</html>
