<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In • AI Question Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml" />
  </head>
  <body class="min-h-screen relative bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white overflow-hidden">
    <!-- Animated glows -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="bg-glow top-10 right-10 w-64 h-64"></div>
      <div class="bg-glow bg-glow-purple bottom-10 left-16 w-[28rem] h-[28rem]"></div>
      <div class="bg-glow bg-glow-cyan top-1/3 left-1/2 w-32 h-32"></div>
    </div>

    <header class="relative z-10 p-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" class="w-9 h-9 rotate-on-hover" alt="QA Analyzer" />
        <div class="text-xl font-semibold">QA Analyzer</div>
      </div>
      <a href="/" class="text-white/70 hover:text-white transition">Back to Landing</a>
    </header>

    <main class="relative z-10 flex items-center justify-center px-6 pb-16">
      <div class="w-full max-w-md">
        <div class="glass-card rounded-2xl p-8 border border-white/10 bg-white/5">
          <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-300 via-purple-300 to-cyan-300 bg-clip-text text-transparent">Welcome back</h1>
            <p class="mt-2 text-white/70">Sign in to continue to your dashboard</p>
          </div>
          <form method="post" action="/login" class="space-y-4">
            <div>
              <label for="email" class="block text-sm text-white/80 mb-1">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label for="password" class="block text-sm text-white/80 mb-1">Password</label>
              <input id="password" name="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex items-center justify-between text-sm">
              <label class="inline-flex items-center gap-2 text-white/70">
                <input type="checkbox" name="remember" class="accent-indigo-500" />
                <span>Remember me</span>
              </label>
              <a href="#" class="text-white/70 hover:text-white">Forgot password?</a>
            </div>
            <button type="submit" class="w-full px-6 py-3 rounded-lg bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-500 hover:from-indigo-600 hover:via-purple-600 hover:to-cyan-600 transition font-semibold">Sign In</button>
          </form>
          <div class="mt-6 text-center text-sm text-white/70">
            New here? <a class="text-indigo-300 hover:text-indigo-200" href="/home">Explore features</a>
          </div>
        </div>
        <div class="mt-6 text-center">
          <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition text-sm">Go to Dashboard →</a>
        </div>
      </div>
    </main>
  </body>
</html>
